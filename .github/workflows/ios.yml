name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'fixtures/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # 用 UDID 指定模拟器：runner 镜像升级后 "name=iPhone 15" 可能已不存在。
      - name: Pick an available simulator
        run: |
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2}' | head -n 1)
          if [ -z "$UDID" ]; then
            echo "::error::没有可用的 iOS 模拟器"
            xcrun simctl list devices available
            exit 1
          fi
          echo "使用模拟器 UDID: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project ClashMgr.xcodeproj \
            -scheme ClashMgr \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build.log

      - name: Test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project ClashMgr.xcodeproj \
            -scheme ClashMgr \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath TestResults.xcresult \
            | tee test.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ios/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ios/build.log
            ios/test.log
          retention-days: 7
          if-no-files-found: ignore

  package-unsigned-ipa:
    name: Package unsigned IPA
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ClashMgr.xcodeproj \
            -scheme ClashMgr \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ClashMgr.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ClashMgr.xcarchive/Products/Applications/ClashMgr.app"
          if [ ! -d "$APP" ]; then
            echo "::error::找不到 ClashMgr.app"
            ls -R "$RUNNER_TEMP/ClashMgr.xcarchive/Products" || true
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry ClashMgr-unsigned.ipa Payload
          ls -lh ClashMgr-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClashMgr-unsigned-ipa
          path: ${{ runner.temp }}/ClashMgr-unsigned.ipa
          retention-days: 30
