name: ClashMgr
options:
  bundleIdPrefix: io.github.clashmgr
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  ClashMgr:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ClashMgr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.clashmgr.app
        PRODUCT_NAME: ClashMgr
        INFOPLIST_FILE: ClashMgr/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

  ClashMgrTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ClashMgrTests
    dependencies:
      - target: ClashMgr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.clashmgr.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ClashMgr:
    build:
      targets:
        ClashMgr: all
        ClashMgrTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ClashMgrTests
